<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Football Match Simulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>⚽ Football Match Simulator</h1>
      <p class="subtitle">เวลาจริง 25 นาที = เวลาในเกม 90 นาที</p>
    </header>

    <div id="login-section" class="card">
      <h2>🔒 เข้าสู่ระบบ</h2>
      <input type="password" id="password-input" placeholder="ใส่รหัสผ่าน...">
      <button id="login-btn">เข้าใช้งาน</button>
      <p id="login-error" class="error"></p>
    </div>

    <div id="main-app" style="display: none;">
      <div class="card">
        <h2>เลือกคู่แข่งขัน & การตัดสิน</h2>
        <div class="teams-row">
          <div class="team-col">
            <label>ทีมที่ 1</label>
            <select id="team-a"></select>
          </div>
          <div class="vs">VS</div>
          <div class="team-col">
            <label>ทีมที่ 2</label>
            <select id="team-b"></select>
          </div>
        </div>

        <div class="rules-section">
          <label>รูปแบบการแข่งขัน:</label>
          <div class="radio-group">
            <label class="radio-label">
              <input type="radio" name="match-mode" value="regular" checked>
              <span>แค่ 90 นาที</span>
            </label>
            <label class="radio-label">
              <input type="radio" name="match-mode" value="extra">
              <span>รวมต่อเวลา</span>
            </label>
            <label class="radio-label">
              <input type="radio" name="match-mode" value="penalty">
              <span>รวมต่อเวลา + จุดโทษ</span>
            </label>
          </div>
        </div>

        <button id="simulate-btn" class="play-btn">▶ เริ่มการแข่งขัน</button>
      </div>

      <div class="card">
        <div class="scoreboard">
          <span id="name-a">-</span>
          <span id="score-a">0</span>
          <span>:</span>
          <span id="score-b">0</span>
          <span id="name-b">-</span>
        </div>
        <div class="timer">
          <span id="period-label">ครึ่งแรก</span>
          นาทีที่ <span id="match-minute">0</span> / <span id="max-minute">45</span>
        </div>

        <canvas id="pitch" width="800" height="450"></canvas>

        <div class="event-box">
          <p id="event-text">กดเริ่มการแข่งขันเพื่อเริ่มจำลอง...</p>
        </div>

        <button id="reset-btn" class="reset-btn">แข่งใหม่</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
